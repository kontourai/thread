name: Publish NPM

on:
  push:
    tags:
      - 'thread-v*'
      - 'ferry-v*'
  workflow_dispatch:

# Serialize publish runs so a duplicate trigger cannot race: the second run
# waits, then the "Check Published Version" step sees the version already on
# npm and skips — instead of E403'ing on a double publish. Keyed per tag so
# thread's and ferry's publishes don't queue behind each other.
concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Only component tags publish; a stray dispatch on a branch just verifies.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      # Publishing stays on the npm CLI: provenance and the registry binding are
      # properties of the publisher, not the installer.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: npm run verify

      - name: Resolve Component From Tag
        id: component
        run: |
          case "${GITHUB_REF_NAME}" in
            thread-v*) echo "workspace=packages/thread" >> "$GITHUB_OUTPUT"; echo "version=${GITHUB_REF_NAME#thread-v}" >> "$GITHUB_OUTPUT" ;;
            ferry-v*)  echo "workspace=packages/ferry"  >> "$GITHUB_OUTPUT"; echo "version=${GITHUB_REF_NAME#ferry-v}"  >> "$GITHUB_OUTPUT" ;;
            *) echo "Not a component tag (${GITHUB_REF_NAME}); nothing to publish." ; echo "workspace=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Verify Tag Matches Package Version
        if: steps.component.outputs.workspace != ''
        run: |
          WS="${{ steps.component.outputs.workspace }}"
          PACKAGE_VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('$WS/package.json', 'utf8')).version")
          if [ "${PACKAGE_VERSION}" != "${{ steps.component.outputs.version }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match $WS version ${PACKAGE_VERSION}" >&2
            exit 1
          fi

      - name: Verify Tagged Commit Is On Main
        if: steps.component.outputs.workspace != ''
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "FETCH_HEAD"; then
            echo "Tagged commit ${GITHUB_SHA} is not reachable from the fetched origin/main tip" >&2
            exit 1
          fi

      - name: Check Published Version
        if: steps.component.outputs.workspace != ''
        id: published
        run: |
          WS="${{ steps.component.outputs.workspace }}"
          PACKAGE_NAME=$(node -p "JSON.parse(require('node:fs').readFileSync('$WS/package.json', 'utf8')).name")
          PACKAGE_VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('$WS/package.json', 'utf8')).version")
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping npm publish."
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

      # The package directory, not `-w`: that flag reads package.json's npm-only
      # `workspaces` field, which this repo no longer carries (pnpm-workspace.yaml
      # is the single source of truth).
      #
      # The leading `./` is load-bearing. npm parses a bare `packages/thread` as
      # a package spec, and `owner/repo` is the GitHub shorthand -- it resolves
      # to `ssh://git@github.com/packages/thread.git` and fails with "Repository
      # not found", never looking at the directory. Only an explicitly relative
      # path is read as a folder.
      - name: Publish
        if: steps.component.outputs.workspace != '' && steps.published.outputs.published != 'true'
        run: npm publish "./${{ steps.component.outputs.workspace }}" --access public --provenance
