name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # Suite-wide secret-scan gate, one normative source (kontourai/.github).
  secret-scan:
    name: Secret Scan
    uses: kontourai/.github/.github/workflows/secret-scan.yml@main
    permissions:
      contents: read

  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reads the exact pnpm version from package.json's packageManager field.
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: npm run verify

  # The root package is private and never publishes; the two workspace members
  # do, each from its own tag. Nothing else in CI runs `npm publish`, so before
  # this job the publish path was exercised for the first time by a release --
  # against a tree pnpm installed, with a hoisting layout npm never produced.
  #
  # This mirrors publish-npm.yml's actual operation: `npm publish <directory>`,
  # not `-w`. The `-w` flag reads package.json's npm-only `workspaces` field,
  # which this repo no longer carries. The `./` prefix is copied deliberately:
  # a bare `packages/thread` is parsed as the GitHub shorthand `owner/repo`,
  # which is the defect this job found on its first run.
  publish-path:
    name: Publish path (dry run)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        workspace: ['packages/thread', 'packages/ferry']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # registry-url is what makes this job differ from the verify job: it
      # writes the .npmrc that `npm publish` reads. Dropping it would leave the
      # interaction between pnpm's install and npm's publish config untested.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Both members ship `dist/src/` and neither declares a prepack, so an
      # unbuilt tree still packs successfully -- as a tarball holding nothing
      # but README and LICENSE. The real publish reaches this point having run
      # `npm run verify`, which builds; the dist assertion below is what makes
      # the difference observable rather than assumed.
      - name: Build
        run: npm run build

      - name: Publish path dry run
        run: |
          set -uo pipefail
          # GitHub runs `run:` blocks as `bash -e {0}`, and `set -uo pipefail`
          # does NOT clear that -e. A bare `npm publish` would kill the step the
          # moment npm exits non-zero -- which is every ordinary pull request --
          # leaving every assertion below unreachable. Capturing the status
          # marks the failure handled so the assertions actually run.
          STATUS=0
          npm publish "./${WORKSPACE}" --dry-run --access public > /tmp/publish-dry-run.log 2>&1 || STATUS=$?
          cat /tmp/publish-dry-run.log

          if ! grep -q "Tarball Contents" /tmp/publish-dry-run.log; then
            echo "::error::npm publish --dry-run assembled no tarball for ${WORKSPACE}; the publish path is unproven." >&2
            exit 1
          fi
          # `files` is `dist/src/`, README, LICENSE. A tarball with no dist
          # entry is a published package with no code in it -- the failure this
          # repo is actually exposed to, and one a file count alone would pass:
          # an unbuilt ferry packs 3 files (LICENSE, README, package.json) and
          # npm exits zero.
          #
          # The match is scoped to the Tarball Contents block rather than the
          # whole log. A plain `grep dist/src/` passed the unbuilt tree, because
          # what it matched was npm's own warning -- "No bin file found at
          # dist/src/cli.js" -- the message announcing the absence the check
          # exists to detect.
          if ! awk '
            /^npm notice Tarball Contents/ { inside = 1; next }
            /^npm notice Tarball Details/  { inside = 0 }
            inside && /dist\/src\// { found = 1 }
            END { exit found ? 0 : 1 }
          ' /tmp/publish-dry-run.log; then
            echo "::error::the ${WORKSPACE} tarball contains no dist/src/ entry; it would publish without its build output." >&2
            exit 1
          fi
          FILES="$(grep -E '^npm notice total files:' /tmp/publish-dry-run.log | grep -oE '[0-9]+$' || echo 0)"
          if [ "${FILES}" -lt 1 ]; then
            echo "::error::npm publish --dry-run reported ${FILES} files; expected a non-empty package." >&2
            exit 1
          fi

          # `--dry-run` still asks the registry whether the version exists, so
          # between releases it refuses with exactly this message. That is a
          # fact about the version, not the package manager, and is the one
          # failure tolerated. Any OTHER non-zero exit is a real publish-path
          # failure and is not swallowed.
          if [ "${STATUS}" -ne 0 ]; then
            if grep -q "cannot publish over the previously published versions" /tmp/publish-dry-run.log; then
              echo "Publish path proven for ${WORKSPACE} from a pnpm-installed tree: ${FILES} files assembled."
              echo "(Registry declined the version as already published, which is expected between releases.)"
              exit 0
            fi
            echo "::error::npm publish --dry-run failed for a reason other than an already-published version." >&2
            exit "${STATUS}"
          fi
          # Exit zero means npm raised no objection. It does NOT establish that
          # the version is unpublished: with an unreachable registry --dry-run
          # also exits zero, so claiming registry state here would assert
          # something unchecked.
          echo "Publish path proven for ${WORKSPACE} from a pnpm-installed tree: ${FILES} files assembled; npm raised no objection."
        env:
          WORKSPACE: ${{ matrix.workspace }}
