name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # Suite-wide secret-scan gate, one normative source (kontourai/.github).
  secret-scan:
    name: Secret Scan
    uses: kontourai/.github/.github/workflows/secret-scan.yml@main
    permissions:
      contents: read

  verify:
    # Org-hosted runners are billing-gated; the self-hosted fleet carries CI
    # (same pattern as sibling repos). Requires this workflow on the
    # "Kontour Build Fleet" runner group's allow-list.
    runs-on: [self-hosted, Linux, X64, fast-feedback]
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify
