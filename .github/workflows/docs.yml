name: Docs

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    uses: kontourai/.github/.github/workflows/docs-gate.yml@main
    with:
      corpus-ref: b8ecf4cd4c6482bb804cdeea617ebe2d9b78ab05
      # A release PR only bumps version fields and changelogs, which can never
      # need a getting-started edit, yet getting-started.md covers both
      # package.json files. So on the release bot's own same-repo PR, a stale
      # doc is reported as a warning instead of failing. Every other PR,
      # merge-group run and push keeps the strict check. All four conditions
      # must hold: the author is the release app, the branch is its release
      # branch, the PR comes from this repository, and the event is a PR.
      advisory-freshness: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'kontourai-releases[bot]' && github.event.pull_request.head.ref == 'release-please--branches--main' && github.event.pull_request.head.repo.full_name == github.repository }}
  pages:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: gate
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: kontourai/.github/.github/workflows/docs-pages.yml@main
    with:
      corpus-ref: b8ecf4cd4c6482bb804cdeea617ebe2d9b78ab05
